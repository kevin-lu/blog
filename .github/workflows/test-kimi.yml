name: Test Kimi Configuration

on:
  workflow_dispatch:

jobs:
  test-kimi-api:
    name: Test Kimi API
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Secrets
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "=== 检查 Secrets 配置 ==="
          echo ""
          
          if [ -z "$LLM_API_KEY" ]; then
            echo "❌ LLM_API_KEY 未设置"
            exit 1
          else
            echo "✅ LLM_API_KEY 已设置"
            echo "   前缀：${LLM_API_KEY:0:15}..."
          fi
          
          if [ -z "$LLM_API_URL" ]; then
            echo "❌ LLM_API_URL 未设置"
            exit 1
          else
            echo "✅ LLM_API_URL 已设置：$LLM_API_URL"
          fi
          
          if [ -z "$LLM_MODEL" ]; then
            echo "⚠️  LLM_MODEL 未设置，使用默认值：moonshot-v1-8k"
            echo "LLM_MODEL=moonshot-v1-8k" >> $GITHUB_ENV
          else
            echo "✅ LLM_MODEL 已设置：$LLM_MODEL"
          fi
      
      - name: Test Kimi API Connection
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'moonshot-v1-8k' }}
        run: |
          echo ""
          echo "=== 测试 Kimi API 连接 ==="
          echo ""
          
          RESPONSE=$(curl -s -X POST "$LLM_API_URL" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$LLM_MODEL\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"你好，Kimi！请用一句话介绍你自己。\"
                }
              ]
            }")
          
          echo "HTTP 响应："
          echo "$RESPONSE" | jq .
          
          if echo "$RESPONSE" | grep -q "error"; then
            echo ""
            echo "❌ API 调用失败"
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message')
            echo "错误信息：$ERROR_MSG"
            exit 1
          else
            echo ""
            echo "✅ API 调用成功"
            echo "Kimi 回复：$(echo "$RESPONSE" | jq -r '.choices[0].message.content')"
          fi
      
      - name: Test Code Review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'moonshot-v1-8k' }}
        run: |
          echo ""
          echo "=== 测试代码审查功能 ==="
          echo ""
          
          # 创建测试 diff
          cat > /tmp/test-diff.txt << 'DIFF'
diff --git a/backend/app/api/test.py b/backend/app/api/test.py
index 1234567..89abcdef 100644
--- a/backend/app/api/test.py
+++ b/backend/app/api/test.py
@@ -1,10 +1,15 @@
 from flask import Blueprint, request
 from app.models import User
 
 bp = Blueprint('test', __name__)
 
 @bp.route('/user/<user_id>')
 def get_user(user_id):
-    user = User.query.get(int(user_id))
+    # N+1 查询示例
+    users = User.query.all()
+    for u in users:
+        profile = u.profile  # 每次循环都查询
+        print(f"User: {u.name}, Profile: {profile}")
+    return {'users': [u.to_dict() for u in users]}
     return {'user': user.to_dict()} if user else {}
DIFF
          
          # 运行 AI 审查
          cd backend
          pip install requests pyyaml
          
          python .github/scripts/ai_code_review.py \
            --pr-number 0 \
            --diff-file /tmp/test-diff.txt \
            --static-analysis-dir /tmp \
            --output-file /tmp/test-review.json || true
          
          echo ""
          echo "审查结果："
          cat /tmp/test-review.json | jq '.summary, .verdict'
          
          CRITICAL_COUNT=$(cat /tmp/test-review.json | jq '.critical_issues | length')
          echo ""
          echo "发现 Critical 问题数：$CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "✅ AI 成功发现问题"
            cat /tmp/test-review.json | jq '.critical_issues[0].type, .critical_issues[0].description'
          else
            echo "⚠️  未发现问题（可能是误报或漏报）"
          fi
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        with:
          name: kimi-test-results
          path: /tmp/test-review.json
      
      - name: Summary
        run: |
          echo "## 🌙 Kimi 配置测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 测试通过" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets 配置正确" >> $GITHUB_STEP_SUMMARY
          echo "- API 连接正常" >> $GITHUB_STEP_SUMMARY
          echo "- 代码审查功能正常" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 创建测试 PR 体验完整流程" >> $GITHUB_STEP_SUMMARY
          echo "2. 查看详细文档：.github/KIMI-CONFIG.md" >> $GITHUB_STEP_SUMMARY
          echo "3. 开始使用 AI 代码审查" >> $GITHUB_STEP_SUMMARY
